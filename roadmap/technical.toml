name = "Metrics without fictitious progress"
kind = "feature"
status = "done"
priority = "P1"
parent = "TEC-082"
source = "TZ §7"
description = "Progress weighted by estimates and met acceptance criteria; blocked, overdue, debt, releases and planned versus actual effort."
acceptance = [
  "[x] Progress is not a count of closed items (unit test)",
  "[x] Overdue items are computed against today's date by the CLI",
]
components = ["crates/est-roadmap/src/metrics.rs", "docs/roadmaps/metrics.md"]

