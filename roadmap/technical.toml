# Technical Roadmap — architecture, components, technical debt (tag `debt`).
# Rules: docs/roadmap-management.md.

# ---------------------------------------------------------------------------
# TEC-001 — the architecture in place (spec v0.3), inventoried by the audit.
# ---------------------------------------------------------------------------

[[item]]
id = "TEC-001"
name = "Modular monolith (spec v0.3)"
kind = "program"
status = "done"
priority = "P0"
source = "spec v0.3 §3–§22"
description = "Rust workspace with dependencies pointing inwards (est-domain ← est-application ← adapters ← est-api/est-cli), ports in est-application, composition root in est-api/src/runtime.rs."
docs = ["docs/architecture.md", "AGENTS.md"]

[[item]]
id = "TEC-002"
name = "Layers and ports"
kind = "epic"
status = "done"
priority = "P0"
parent = "TEC-001"
release = "REL-001"
description = "est-domain has no SQLx/Axum/Git/LLM/Docker dependencies; every infrastructure capability is a port in est-application/src/ports.rs with an adapter crate."
acceptance = ["[x] est-domain depends only on est-core, serde, serde_json and thiserror", "[x] Adapters are wired only in est-api/src/runtime.rs"]
components = ["crates/est-domain", "crates/est-application/src/ports.rs", "crates/est-api/src/runtime.rs"]

[[item]]
id = "TEC-003"
name = "SQLite storage with append-only migrations"
kind = "epic"
status = "done"
priority = "P0"
parent = "TEC-001"
release = "REL-001"
description = "Repositories over SQLite with portable SQL; migrations 0001–0009."
acceptance = ["[x] Migrations live in /migrations and are never edited once applied"]
components = ["crates/est-storage", "migrations"]

[[item]]
id = "TEC-004"
name = "REST and WebSocket API with the local guard"
kind = "epic"
status = "done"
priority = "P0"
parent = "TEC-001"
release = "REL-001"
description = "Axum /api/v1 and /api/v1/events; the daemon trusts only its own Host and Origin; mutating endpoints take JSON."
acceptance = ["[x] Requests with a foreign Host or Origin are refused", "[x] User-visible flows are covered in crates/est-api/tests/learning_loop.rs"]
components = ["crates/est-api", "crates/est-api/src/guard.rs", "crates/est-api/tests/learning_loop.rs"]

[[item]]
id = "TEC-005"
name = "AI Gateway"
kind = "epic"
status = "done"
priority = "P0"
parent = "TEC-001"
release = "REL-001"
description = "OpenAI-compatible, OpenAI and Claude providers with presets, a switchable LlmSlot, streaming through ProseStream so code never reaches the client before the policy check."
acceptance = ["[x] Providers switch without a restart and log ai.provider.changed without the key", "[x] Keys are stored outside config, events, logs and exports"]
components = ["crates/est-ai", "crates/est-ai-policy/src/stream.rs", "crates/est-application/src/streaming.rs"]

[[item]]
id = "TEC-006"
name = "Policy engine"
kind = "epic"
status = "done"
priority = "P0"
parent = "TEC-001"
release = "REL-001"
description = "Request classification, required level, one-step escalation, response constraints, tool permissions and external-action gates — all in code before a model is called."
acceptance = ["[x] A model cannot raise its own level or assume consent", "[x] The mentor (Initiator::Mentor) is refused every external action"]
components = ["crates/est-ai-policy"]

[[item]]
id = "TEC-007"
name = "Remote sources and the publish gate"
kind = "epic"
status = "done"
priority = "P1"
