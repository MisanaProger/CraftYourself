components = ["crates/est-remote", "crates/est-application/src/remote.rs", "crates/est-ai-policy/src/gates.rs"]

# ---------------------------------------------------------------------------
# TEC-010 — Assessment foundation (TZ Phase 2).
# ---------------------------------------------------------------------------

[[item]]
id = "TEC-010"
name = "Assessment foundation"
kind = "program"
status = "planned"
priority = "P0"
source = "TZ Phase 2"
description = """
Stored, traceable and reproducible assessment: an evidence ledger, provenance of every \
assessment, versioned scoring rules, the competency graph and the extended Issue lifecycle."""
docs = ["docs/specifications/evidence-assessment.md", "docs/decisions/ADR-0002-evidence-ledger.md"]

[[item]]
id = "TEC-011"
name = "Evidence ledger"
kind = "epic"
status = "planned"
priority = "P0"
parent = "TEC-010"
release = "REL-002"
risk = "medium"
source = "TZ 2.1"
description = """
Today evidence is recomputed from lesson_results and session_summaries on every request \
(est-application/src/skills.rs) and only its latest form is visible. The ledger stores \
evidence records with all fields required by TZ 2.1, append-only, so an assessment can be \
explained and reproduced."""
docs = ["docs/specifications/evidence-assessment.md", "docs/decisions/ADR-0002-evidence-ledger.md"]

[[item]]
id = "TEC-012"
name = "Evidence record in the domain"
kind = "feature"
status = "ready"
priority = "P0"
parent = "TEC-011"
implements = ["LRN-014"]
source = "TZ 2.1"
description = "EvidenceRecord in est-domain: learner, Issue/lesson reference, skill reference, evidence type, observed_at, help level, check result, reliability, source context, rule version."
acceptance = [
  "[ ] EvidenceRecord carries every field listed in TZ 2.1 and a rule version",
  "[ ] Evidence types are the seven of TZ 2.1 (LRN-012) as an enum, serialised in snake_case",
  "[ ] Help level is the highest engagement level used plus hint counts by stage",
  "[ ] Unit tests cover invariants: score 0–100, skill exists in the catalog version, observed_at not in the future",
]
components = ["crates/est-domain"]
docs = ["docs/specifications/evidence-assessment.md#record"]

[[item]]
id = "TEC-013"
name = "Evidence derivation from observed events"
kind = "feature"
status = "planned"
priority = "P0"
parent = "TEC-011"
depends_on = ["TEC-012"]
implements = ["LRN-012", "LRN-013"]
risk = "medium"
description = "Pure rules turning a finished session, quiz attempt, artifact result or control task into evidence records — several per Issue, distinguishing independent from supported work."
acceptance = [
  "[ ] One Issue can produce several records (per skill and per type)",
  "[ ] Independent and supported executions produce different types and reliabilities",
  "[ ] The same input always yields the same records (property test over shuffled event order)",
  "[ ] Derivation never calls a model and never reads the ADI",
]
components = ["crates/est-discipline"]

[[item]]
id = "TEC-014"
name = "Persistent evidence store"
kind = "feature"
status = "planned"
priority = "P0"
parent = "TEC-011"
depends_on = ["TEC-012"]
tags = ["debt"]
description = "Append-only table for evidence records (new migration), repository port and adapter; records are corrected by superseding records, never edited."
acceptance = [
  "[ ] A new migration adds the evidence table; earlier migrations are untouched",
  "[ ] Records are never updated in place; a correction references the record it supersedes",
  "[ ] Deleting a conversation removes or anonymises its records as today's summaries are",
  "[ ] Records appear in the full data export",
]
components = ["crates/est-storage", "migrations", "crates/est-application/src/ports.rs"]

[[item]]
id = "TEC-015"
name = "Backfill evidence from existing data"
kind = "feature"
status = "planned"
priority = "P0"
parent = "TEC-011"
depends_on = ["TEC-013", "TEC-014"]
description = "On first start after the migration, existing lesson_results and session_summaries are converted to records with rule version `backfill-1` and reliability that marks missing fields."
acceptance = [
  "[ ] The Skill Matrix computed from backfilled records equals the one computed today (test with fixtures)",
  "[ ] Backfill runs once and is idempotent",
]

[[item]]
id = "TEC-016"
name = "Assessment explanation API"
kind = "feature"
status = "planned"
priority = "P0"
parent = "TEC-011"
depends_on = ["TEC-014", "TEC-018"]
implements = ["PRD-032"]
description = "GET endpoints returning the records and the computation behind a skill's or discipline's assessment."
acceptance = [
  "[ ] GET /analytics/skills/{discipline}/{skill}/evidence returns records with provenance",
  "[ ] The response includes the rule id, version and inputs that reproduce the score",
  "[ ] Covered in learning_loop.rs; client added to frontend/src/services/api.ts",
]

[[item]]
id = "TEC-017"
name = "Provenance and assessment versioning"
kind = "epic"
status = "planned"
priority = "P0"
parent = "TEC-010"
release = "REL-002"
source = "TZ 4.4, 3.6, Phase 2 “Assessment Versioning”"
description = "Every assessment records what produced it, and can be recomputed under the same rule version."
docs = ["docs/specifications/evidence-assessment.md#provenance"]

[[item]]
id = "TEC-018"
name = "Provenance of assessments"
kind = "feature"
status = "planned"
priority = "P0"
parent = "TEC-017"
depends_on = ["TEC-014"]
source = "TZ 4.4"
description = "For each assessment: the triggering learner action (event ids), criteria version, the model involved (if any, only as explainer), evidence ids and the computation."
acceptance = [
  "[ ] Every ADI assessment and Skill Matrix snapshot stores event ids, rule version and evidence ids",
  "[ ] A model's participation is recorded by provider/model name without secrets",
  "[ ] An assessment without provenance cannot be stored (domain invariant)",
]

[[item]]
id = "TEC-019"
name = "Versioned scoring rules"
kind = "feature"
status = "planned"
priority = "P0"
parent = "TEC-017"
depends_on = ["TEC-018"]
description = "A registry of rule versions (observed-0.2, esm-catalog-0.2, …) kept in code so an old assessment can be recomputed with its own version and compared with the current one."
acceptance = [
  "[ ] Recomputing a stored assessment with its version returns the stored result (test)",
  "[ ] A version bump never silently changes stored assessments; re-scoring is an explicit, recorded action",
]

[[item]]
id = "TEC-020"
