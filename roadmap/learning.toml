[[item]]
id = "LRN-035"
name = "Self-reflection"
kind = "feature"
status = "proposed"
priority = "P1"
parent = "LRN-032"
source = "TZ 2.9"
description = "Reflection prompts for selected Issue types; answers are stored and used as context for later analysis, and become explanation evidence only when checked."

[[item]]
