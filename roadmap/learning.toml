source = "TZ 2.7"
description = "Correctness, time and space complexity, stability, accuracy, readability, extensibility and applicability, weighted per discipline and Issue; the choice of method is assessed, not only the answer."
docs = ["docs/specifications/solution-comparison.md"]

[[item]]
