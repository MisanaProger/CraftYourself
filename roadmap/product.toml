status = "done"
priority = "P0"
parent = "PRD-001"
release = "REL-001"
source = "spec v0.3 stage 7"
description = "The learner sees their AI Dependency Index per Issue and over time, and a Skill Matrix assessed from evidence with status, confidence, dimensions and history."
