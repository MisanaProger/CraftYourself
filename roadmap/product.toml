[[item]]
id = "PRD-030"
name = "Evidence-based learning platform"
kind = "program"
status = "planned"
priority = "P0"
source = "TZ Functional Expansion §1.2"
description = """
CraftYourself assesses real engineering competence and how it develops over time: every \
assessment has observable grounds the learner can inspect, knowledge is re-checked, gaps and \
systematic errors shape the next Issues, and the learner's independence and ability to \
transfer knowledge are measured rather than assumed."""
