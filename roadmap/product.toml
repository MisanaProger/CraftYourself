# Product Roadmap — what the learner gets. Rules: docs/roadmap-management.md.

# ---------------------------------------------------------------------------
# PRD-001 — the shipped core (stages 0–9 of spec v0.3), inventoried by the
# repository audit (docs/audit/2026-11-repository-audit.md).
# ---------------------------------------------------------------------------

[[item]]
id = "PRD-001"
name = "Core learning loop"
kind = "program"
status = "in-progress"
priority = "P0"
source = "spec v0.3 §24, §30"
description = """
A local-first trainer: the learner works on real Issues and problems in their own IDE, a \
mentor helps within an engagement level the learner consented to, and the platform assesses \
dependence on AI (ADI) and engineering skills (Skill Matrix) from observed events only. \
Stages 0–7 and 9 are shipped; stage 8 (interactive learning) and the desktop app are partly done."""
docs = ["docs/architecture.md", "README.md"]

[[item]]
id = "PRD-002"
name = "Projects and per-Issue workspaces"
kind = "epic"
status = "done"
priority = "P0"
parent = "PRD-001"
release = "REL-001"
source = "spec v0.3 stage 1"
description = "Local and remote repositories, detected languages and license, a workspace and branch per Issue, opening the external IDE, Git status and diff."
acceptance = [
  "[x] A project is added from a local path or a remote URL and its languages and license are detected",
  "[x] Starting a task creates ~/.est/workspaces/<project>/<task> and the branch est/<task>",
  "[x] The session shows Git status and the diff against the base",
]
components = ["crates/est-projects", "crates/est-workspace", "crates/est-git", "frontend/src/project", "frontend/src/workspace"]

[[item]]
id = "PRD-003"
name = "Tasks, Issues and online-judge problems"
kind = "epic"
status = "done"
priority = "P0"
parent = "PRD-001"
release = "REL-001"
source = "spec v0.3 stage 3"
description = """
Tasks with statuses, sessions and acceptance criteria; Exercise Manifests; LeetCode and \
Codeforces problems with samples run in the sandbox; GitHub/GitLab Issues imported after a \
fixed-rule suitability check; discovery of Issues and problems planned by a model and run by code."""
acceptance = [
  "[x] Exercise Manifests are imported and validated (est-exercises)",
  "[x] Problems are imported from pasted input or loaded from the judge with the learner's network permission",
  "[x] Issues are imported only after the suitability rules; re-import returns the same task",
  "[x] Discovery validates the model's search plan; candidates come only from search results",
]
components = ["crates/est-exercises", "crates/est-problems", "crates/est-issues", "crates/est-remote", "crates/est-application/src/discovery.rs", "frontend/src/issue", "frontend/src/problems", "frontend/src/discovery"]
docs = ["docs/architecture.md"]

[[item]]
id = "PRD-004"
name = "Chat-first mentor with engagement levels"
kind = "epic"
status = "done"
priority = "P0"
parent = "PRD-001"
release = "REL-001"
source = "spec v0.3 stages 4–5"
description = """
Conversations with cards and streaming answers; engagement levels L0–L4 decided in code, \
one-step escalation with explicit consent, the documentation boundary, code limits, several \
LLM providers switchable from the UI."""
implements = ["LRN-002"]
acceptance = [
  "[x] Every new Issue starts at L0; escalation is one step and needs accept or the learner's own raise",
  "[x] The required level is decided by deterministic rules before any model call",
  "[x] Streaming shows prose only; code is withheld until the policy check of the whole answer",
]
components = ["crates/est-ai-policy", "crates/est-ai", "crates/est-application/src/conversation.rs", "crates/est-application/src/streaming.rs", "frontend/src/chat", "frontend/src/escalation"]

