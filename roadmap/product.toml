acceptance = [
  "[x] A session summary is written when a session ends, with counters and ids only",
  "[x] GET /recommendations/activity shows the learner what the model will receive",
  "[x] Recommendations reference only programs and Issues from the snapshot",
]
components = ["crates/est-domain/src/knowledge.rs", "crates/est-application/src/knowledge.rs", "crates/est-application/src/recommendations.rs", "frontend/src/analytics/KnowledgePage.tsx"]

[[item]]
