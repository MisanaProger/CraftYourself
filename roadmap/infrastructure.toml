[[item]]
id = "INF-030"
name = "Security, data and operations"
kind = "program"
status = "in-progress"
priority = "P0"
description = "Security rules of AGENTS.md, data management and operations of the Local Edition."

[[item]]
id = "INF-031"
name = "Security baseline"
kind = "epic"
status = "done"
priority = "P0"
parent = "INF-030"
release = "REL-001"
description = "Host/Origin guard, secrets only from the environment or 0600 key files, isolated artifacts and model pages, quiz answers kept on the server."
acceptance = [
  "[x] Learning artifacts and model HTML are served with CSP sandbox allow-scripts and shown in sandboxed iframes",
  "[x] No secrets in config, events, messages, logs or exports",
]
components = ["crates/est-api/src/guard.rs", "crates/est-api/src/routes/isolated.rs", "frontend/src/ui/IsolatedFrame.tsx"]

[[item]]
id = "INF-032"
name = "Data management"
kind = "epic"
status = "planned"
priority = "P0"
parent = "INF-030"
source = "TZ 4.5, §5.2 E"
description = "Deleting, switching and backing up the learner's data."

[[item]]
id = "INF-033"
name = "Delete all learner data"
kind = "feature"
status = "planned"
priority = "P0"
parent = "INF-032"
release = "REL-001"
implements = ["PRD-046"]
description = "One confirmed action removing every learner table, secrets and workspaces, through a JSON-body endpoint."
acceptance = [
  "[ ] DELETE-all requires a confirmation token returned by a preview call",
  "[ ] After it, the export contains no learner data (test)",
]

[[item]]
id = "INF-034"
name = "Enforce the analytics switch"
kind = "feature"
status = "planned"
priority = "P0"
parent = "INF-032"
release = "REL-001"
implements = ["PRD-046"]
tags = ["debt"]
description = "PrivacySettings.history_analytics is hard-coded to true (est-application/src/analytics.rs); make it a stored setting that the recommendation, discovery and profile code honours."
acceptance = [
  "[ ] The setting persists across restarts",
  "[ ] With it off, recommendations and discovery do not include history in the snapshot (test)",
]
components = ["crates/est-application/src/analytics.rs"]

