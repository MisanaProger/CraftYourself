status = "done"
priority = "P1"
parent = "INF-016"
description = "Exercise Manifest test commands and run_samples.sh for judge problems, with parsed summaries."
acceptance = ["[x] Sample and test runs are parsed into passed/failed summaries (est-languages/src/summary.rs)"]
components = ["crates/est-languages/src/summary.rs", "crates/est-problems"]

[[item]]
id = "INF-018"
