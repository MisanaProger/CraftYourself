# Infrastructure & Security Roadmap — CI/CD, sandbox and engineering tools,
# security, data management, operations. Rules: docs/roadmap-management.md.

[[item]]
id = "INF-001"
name = "Build, test and release infrastructure"
kind = "program"
status = "in-progress"
priority = "P0"
description = "CI for the workspace, the frontend and the desktop app; release packaging."

[[item]]
id = "INF-002"
name = "Continuous integration"
kind = "epic"
status = "done"
priority = "P0"
parent = "INF-001"
release = "REL-001"
description = "GitHub Actions: rustfmt, clippy with -D warnings, workspace tests, frontend build, desktop clippy."
acceptance = ["[x] Every push and pull request runs the rust, frontend and desktop jobs"]
components = [".github/workflows/ci.yml"]

[[item]]
id = "INF-003"
name = "Roadmap integrity in CI"
kind = "feature"
status = "done"
priority = "P0"
parent = "INF-002"
source = "TZ 5.12, §8 (6)"
description = "crates/est-roadmap/tests/repository.rs checks the repository's roadmap data and that the generated views are current, as part of cargo test --workspace."
acceptance = [
  "[x] A roadmap error fails cargo test --workspace",
  "[x] A stale view fails cargo test --workspace with the command that fixes it",
]
components = ["crates/est-roadmap/tests/repository.rs"]

[[item]]
id = "INF-004"
name = "Desktop distribution"
kind = "epic"
status = "proposed"
priority = "P1"
parent = "INF-001"
description = "Signed installers, auto-update channel, testing on Windows and macOS."

[[item]]
id = "INF-005"
name = "Sandbox integration tests in CI"
kind = "feature"
status = "proposed"
priority = "P2"
parent = "INF-001"
description = "Run EST_SANDBOX_IT=1 cargo test -p est-sandbox on a runner with Docker."

[[item]]
id = "INF-010"
name = "Code execution and engineering tools"
kind = "program"
status = "in-progress"
priority = "P1"
source = "TZ §3, Phase 5"
description = "The sandbox and the tools that check practical solutions."
docs = ["docs/specifications/engineering-tools.md"]

[[item]]
id = "INF-011"
name = "Code sandbox"
kind = "epic"
status = "in-progress"
priority = "P1"
parent = "INF-010"
source = "TZ 3.1"
description = "Isolated execution of learner code. The TZ 3.1 requirements are met by est-sandbox except stronger isolation options."

[[item]]
id = "INF-012"
name = "Container sandbox with limits"
kind = "feature"
status = "done"
priority = "P0"
parent = "INF-011"
release = "REL-001"
source = "TZ 3.1, AGENTS.md rule 3"
description = "Docker/Podman with --network none by default, --cap-drop ALL, --read-only, no-new-privileges, CPU/memory/pids/time limits, read-only workspace mount, test summaries."
acceptance = [
  "[x] Isolation, time and memory limits, file-system and network control, test runs and result collection (TZ 3.1)",
  "[x] Network for a run needs the learner's explicit permission",
  "[x] Untrusted code never runs on the host",
]
components = ["crates/est-sandbox", "crates/est-languages"]

[[item]]
id = "INF-013"
name = "gVisor or Kata isolation option"
kind = "feature"
status = "proposed"
priority = "P2"
parent = "INF-011"
description = "Optional stronger runtime for the same container flags."

[[item]]
id = "INF-014"
name = "Image presets and a dependency-fetch step"
kind = "feature"
status = "proposed"
priority = "P2"
parent = "INF-011"
description = "Per-language image presets and a manifest-declared step that fetches dependencies with permission before the offline run; Windows and macOS notes."

[[item]]
id = "INF-016"
