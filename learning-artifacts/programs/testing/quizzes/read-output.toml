[[question]]
id = "left-right"
code = """assertion `left == right` failed
  left: [1, 2]
 right: [1, 2, 3]"""
text.ru = "Тест вызывает `assert_eq!(parse_range(\"1..3\"), vec![1, 2, 3])`. Что вернула функция?"
text.en = "The test calls `assert_eq!(parse_range(\"1..3\"), vec![1, 2, 3])`. What did the function return?"
text.uz = "Test `assert_eq!(parse_range(\"1..3\"), vec![1, 2, 3])` ni chaqiradi. Funksiya nima qaytardi?"
options = [
  { ru = "[1, 2, 3]", en = "[1, 2, 3]", uz = "[1, 2, 3]" },
  { ru = "[1, 2]", en = "[1, 2]", uz = "[1, 2]" },
  { ru = "Ничего: тест не скомпилировался", en = "Nothing: the test did not compile", uz = "Hech narsa: test kompilyatsiya bo‘lmadi" },
]
answer = 1
explanation.ru = "`left` — первый аргумент `assert_eq!`, здесь это результат функции. Не хватает верхней границы: похоже на `..` вместо `..=`."
explanation.en = "`left` is the first argument of `assert_eq!`, here the function's result. The upper bound is missing — it looks like `..` instead of `..=`."
explanation.uz = "`left` — `assert_eq!` ning birinchi argumenti, bu yerda funksiya natijasi. Yuqori chegara yetishmaydi: `..=` o‘rniga `..` ga o‘xshaydi."

[[question]]
id = "location"
code = "thread 'tests::parses_inclusive_range' panicked at src/lib.rs:21:9"
text.ru = "На что указывает `src/lib.rs:21:9`?"
text.en = "What does `src/lib.rs:21:9` point to?"
text.uz = "`src/lib.rs:21:9` nimani ko‘rsatadi?"
options = [
  { ru = "На строку с ошибкой в реализации", en = "The line with the bug in the implementation", uz = "Amalga oshirishdagi xato satrini" },
  { ru = "На строку с проверкой, которая не выполнилась", en = "The line with the assertion that failed", uz = "Bajarilmagan tekshiruv satrini" },
  { ru = "На начало файла с тестами", en = "The start of the test file", uz = "Test faylining boshini" },
]
answer = 1
explanation.ru = "Паника происходит в `assert_eq!`. Где ошибка в коде, тест не знает — это предстоит выяснить вам."
explanation.en = "The panic happens inside `assert_eq!`. The test does not know where the bug is — that is for you to find out."
explanation.uz = "Panika `assert_eq!` ichida yuz beradi. Kodda xato qayerdaligini test bilmaydi — buni siz aniqlaysiz."

