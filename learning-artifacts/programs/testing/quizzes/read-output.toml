[[question]]
id = "summary"
code = "test result: FAILED. 7 passed; 2 failed; 1 ignored; 0 measured; 0 filtered out"
text.ru = "Сколько тестов упало?"
text.en = "How many tests failed?"
text.uz = "Nechta test yiqildi?"
options = [
  { ru = "1", en = "1", uz = "1" },
  { ru = "2", en = "2", uz = "2" },
  { ru = "7", en = "7", uz = "7" },
  { ru = "10", en = "10", uz = "10" },
]
answer = 1
explanation.ru = "В итоговой строке: 7 прошли, 2 упали, 1 пропущен (ignored)."
