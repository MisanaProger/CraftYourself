[[program]]
id = "testing"
status = "available"
icon = "test"
disciplines = ["debugging-testing"]
level = "beginner"
minutes = 90
title.ru = "Тесты: запуск и качество"
title.en = "Tests: running and quality"
title.uz = "Testlar: ishga tushirish va sifat"
summary.ru = "Как запускать тесты и читать их вывод, что отличает хороший тест, граничные значения и регрессионный тест в песочнице."
summary.en = "How to run tests and read their output, what makes a good test, boundary values and a regression test in the sandbox."
summary.uz = "Testlarni qanday ishga tushirish va natijasini o‘qish, yaxshi test nimadan iborat, chegaraviy qiymatlar va sandboxda regressiya testi."

