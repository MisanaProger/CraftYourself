[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/MisanaProger/Engineer-Craft"
rust-version = "1.80"

[workspace.dependencies]
est-core = { path = "crates/est-core" }
est-exercise = { path = "crates/est-exercise" }
est-git = { path = "crates/est-git" }
est-policy = { path = "crates/est-policy" }
est-storage = { path = "crates/est-storage" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
http-body-util = "0.1"
