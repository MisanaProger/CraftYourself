# Example exercise: write a property-style test for an existing function in a
# real open-source project (ripgrep's `globset` crate, tag 14.1.1).
manifest_version = 1

[exercise]
id = "globset-escape-roundtrip"
version = "1.0.0"
title = "Prove that globset::escape produces literal patterns"
description = """
`globset::escape` turns an arbitrary string into a glob that should match only
that exact string. The existing unit test checks a handful of fixed examples.
Write a test that checks the round-trip property — `Glob::new(&escape(s))`
matches `s` — for many different inputs, including every glob meta-character.
"""
task_type = "testing"
difficulty = "beginner"
learning_goals = [
    "Navigate an unfamiliar crate inside a Cargo workspace",
    "Find an existing test module and follow its conventions",
    "Express a property of a function as a test",
    "Run a single crate's tests with cargo",
]
disciplines = ["debugging-testing"]

[source]
repository = "https://github.com/BurntSushi/ripgrep"
revision = "4649aa9700619f94cf9c66876e9549d83420e16c"
branch = "master"
license = "Unlicense OR MIT"
language = "rust"

[conditions]
prerequisites = ["Basic Rust syntax", "cargo test"]
scope = ["crates/globset/src/lib.rs"]

[commands]
build = "cargo build -p globset"
test = "cargo test -p globset"

[[criteria]]
id = "tests-pass"
kind = "command"
description = "All globset tests pass"
command = "cargo test -p globset"
weight = 3

[[criteria]]
id = "property-covered"
kind = "manual"
description = "The new test checks the round-trip property for inputs containing ?, *, [ and ]"
weight = 2

[[criteria]]
id = "commit-quality"
kind = "commits"
description = "One focused commit with an imperative subject line that explains what is tested"

[mentor]
max_level = 3

[[docs]]
title = "globset crate documentation"
url = "https://docs.rs/globset/latest/globset/"
topics = ["globset", "Glob", "GlobMatcher", "escape"]

[[docs]]
title = "The Rust Book: How to Write Tests"
url = "https://doc.rust-lang.org/book/ch11-01-writing-tests.html"
topics = ["test", "assert_eq", "cfg(test)"]
