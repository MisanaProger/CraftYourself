[package]
name = "craft-yourself"
description = "Craft Yourself desktop app (Tauri): the local daemon and the interface in one window"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"
publish = false

[[bin]]
name = "craft-yourself"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = "0.8"
est-api = { path = "../../crates/est-api" }
est-workspace = { path = "../../crates/est-workspace" }
include_dir = "0.7"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[features]
# Used by `cargo tauri dev`/`build`; keep it so the Tauri CLI works.
custom-protocol = ["tauri/custom-protocol"]
